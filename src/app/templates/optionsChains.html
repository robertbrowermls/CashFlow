<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>{{appName}}</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="http://localhost:3002/styles.css" rel="stylesheet">
  <link href="http://localhost:3002/tableSorting.css" rel="stylesheet">
</head>

<body>
  <h1>Options Chains</h1>
  <table id="myTable">
    <thead>
      <tr>
        <th data-type="text">Symbol</th>
        <th data-type="text">Underlying</th>
        <th data-type="number">Strike</th>
        <th data-type="text">Type</th>
        <th data-type="date">Expiration</th>
        <th data-type="number">Bid</th>
        <th data-type="number">Ask</th>
      </tr>
    </thead>
    <tbody>
      {{#each optionsChains}}
      <tr>
        <td>{{symbol}}</td>
        <td>{{underlying}}</td>
        <td>{{strike}}</td>
        <td>{{option_type}}</td>
        <td>{{expiration_date}}</td>
        <td>{{bid}}</td>
        <td>{{ask}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  <script src="http://localhost:3002/tableSorting.js"></script>
</body>

</html>
